<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Attendance Login</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --input-border: #cbd5e1;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            position: relative;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/login_background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(0px) brightness(0.8); 
            z-index: -1; 
            transform: scale(1.05); 
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            perspective: 1000px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px); 
        }

        .header-section {
            margin-bottom: 36px;
        }

        .welcome-box {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .error-alert {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.1);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding-left: 2px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background-color: rgba(248, 250, 252, 0.8);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .submit-row {
            margin-top: 8px;
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body>
    <div class='login-wrapper'>
        <div class="login-card">
            <div class='header-section'>
                <h1 class='welcome-box'>Welcome to NSPU</h1>
                <p class='subtitle'>Portal Login For Attendance</p>
            </div>
            {{ error_message }}
            <form class='login-form' method='POST' action='/login'>
                <div class='input-group'>
                    <label for='account'>Account</label>
                    <input type='text' id='account' name='account' class='input-field' placeholder='Enter your account UID' required autocomplete='username'>
                </div>
                
                <div class='input-group'>
                    <label for='password'>Password</label>
                    <input type='password' id='password' name='password' class='input-field' placeholder='••••••••' required autocomplete='current-password'>
                </div>
                
                <div class='submit-row'>
                    <button type='submit' class='login-btn'>Sign In</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
